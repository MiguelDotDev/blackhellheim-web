name: Despliegue web

on:
  push:
    branches: [main]

permissions:
  contents: read

# Un despliegue a la vez y nunca se cancela uno en curso. Grupo distinto del de ci.yml (que usa «ci-…»).
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  desplegar:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    permissions:
      contents: read
      id-token: write # OIDC contra Azure
      packages: write # publicar en GHCR con github.token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Calcular nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blackhellheim-web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Construir la imagen
        run: docker build -t "$IMAGEN" .

      - name: Publicar en GHCR
        env:
          TOKEN_GHCR: ${{ github.token }}
        run: |
          echo "$TOKEN_GHCR" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGEN"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la Container App a la imagen de este commit
        env:
          APP_WEB: ${{ vars.APP_WEB }}
          GRUPO_RECURSOS: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az containerapp update --name "$APP_WEB" --resource-group "$GRUPO_RECURSOS" --image "$IMAGEN"

      - name: Comprobar el despliegue
        env:
          APP_WEB: ${{ vars.APP_WEB }}
          GRUPO_RECURSOS: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          fqdn=$(az containerapp show --name "$APP_WEB" --resource-group "$GRUPO_RECURSOS" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "https://$fqdn/" > /dev/null
          curl --silent --show-error "https://$fqdn/api/salud" || echo "::warning::/api/salud no respondió (informativo)"
